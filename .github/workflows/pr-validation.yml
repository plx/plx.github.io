name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    name: Validate PR
    uses: ./.github/workflows/build.yml
    with:
      checkout-ref: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read
